
name: Fase 3 - Seguridad PR

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  semgrep:
    permissions:
      contents: read
    name: Analisis SAST con Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Instalar Semgrep
        run: python -m pip install semgrep

      - name: Probar regla propia
        run: semgrep --test seguridad/fase-3/semgrep

      - name: Analizar aplicacion
        run: |
          semgrep scan \
            --config seguridad/fase-3/semgrep \
            --error app/

  gitleaks:
    permissions:
      contents: read
    name: Deteccion de secretos con Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Preparar referencia de main
        run: git fetch --no-tags origin main

      - name: Crear directorio de reportes
        run: mkdir -p reportes

      - name: Escanear secretos nuevos del PR
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            git /repo \
            --log-opts="origin/main..HEAD" \
            --report-format json \
            --report-path /repo/reportes/gitleaks.json \
            --redact \
            --exit-code 1

      - name: Subir reporte de Gitleaks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reporte-gitleaks
          path: reportes/
          if-no-files-found: ignore

  dependencias:
    permissions:
      contents: read
      pull-requests: read
    name: Dependencias nuevas con Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Revisar dependencias
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
