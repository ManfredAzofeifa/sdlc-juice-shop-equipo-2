rules:
  - id: feedback-userid-no-confiar-cliente
    message: >-
      CWE-639: No asigne la autoría de feedback usando UserId recibido del cliente.
      Obtenga el identificador del usuario de la sesión autenticada y valide
      la autorización en el servidor. Requerimiento #13.
    severity: ERROR
    languages: [javascript]
    metadata:
      requerimiento: 13
      cwe: CWE-639
      categoria: seguridad
      caso_abuso: 12
    pattern-either:
      - pattern: 'UserId: req.body.UserId'
      - pattern: 'UserId: req.body.userId'
      - pattern: 'UserId: request.body.UserId'
      - pattern: 'UserId: request.body.userId'